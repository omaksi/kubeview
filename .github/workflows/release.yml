name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      # fail-fast: false so a notarization hiccup on one app doesn't cancel
      # the other mid-flight - they're independent artifacts of one tag.
      fail-fast: false
      matrix:
        include:
          - app_name: KubeView
            product: KubeView
            bundle_id: com.omaksi.kubeview
            cask: kubeview
          - app_name: LgtmView
            product: LgtmView
            bundle_id: com.omaksi.lgtmview
            cask: lgtm-view
    env:
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' && 'true' || 'false' }}
      HAS_DEV_ID: ${{ secrets.DEV_ID_CERT_P12 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --product "${{ matrix.product }}"
          swift build -c release --arch x86_64 --product "${{ matrix.product }}"
          mkdir -p build
          lipo -create -output "build/${{ matrix.product }}" \
            ".build/arm64-apple-macosx/release/${{ matrix.product }}" \
            ".build/x86_64-apple-macosx/release/${{ matrix.product }}"
          lipo -info "build/${{ matrix.product }}"

      - name: Generate app icon
        run: |
          mkdir -p Resources
          ./scripts/make_icon.swift

      - name: Bundle .app
        run: |
          ./scripts/bundle.sh \
            --bin "build/${{ matrix.product }}" \
            --app-name "${{ matrix.app_name }}" \
            --bundle-id "${{ matrix.bundle_id }}" \
            --product "${{ matrix.product }}" \
            --out build \
            --version "${{ steps.ver.outputs.version }}"

      # Imports into a throwaway keychain rather than login.keychain — the
      # runner is ephemeral, but a temp keychain keeps the private key out of
      # any step that doesn't need it and dies with the job. Each matrix leg
      # is its own VM, so importing per-leg is required, not just tolerated.
      - name: Import Developer ID certificate
        if: env.HAS_DEV_ID == 'true'
        env:
          DEV_ID_CERT_P12: ${{ secrets.DEV_ID_CERT_P12 }}
          DEV_ID_CERT_PASSWORD: ${{ secrets.DEV_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$DEV_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$DEV_ID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          # Read the identity back rather than hardcoding the name — it embeds
          # the team ID and has to match the cert byte for byte.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported .p12"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Hardened runtime (--options runtime) and a secure timestamp are both
      # mandatory for notarization; a signature missing either is rejected.
      - name: Sign
        run: |
          APP="build/${{ matrix.app_name }}.app"
          if [ "$HAS_DEV_ID" = "true" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" "$APP"
          else
            echo "::warning::No Developer ID secrets — falling back to ad-hoc signing (not notarized)"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --strict --verbose=2 "$APP"

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.app_name }}.app" \
            "${{ matrix.app_name }}-${{ steps.ver.outputs.tag }}.zip"

      # Staples the ticket onto the .app, so the zip has to be rebuilt
      # afterwards — and the checksum taken after that, not before.
      - name: Notarize and staple
        if: env.HAS_DEV_ID == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          cd build
          APP="${{ matrix.app_name }}.app"
          ZIP="${{ matrix.app_name }}-${{ steps.ver.outputs.tag }}.zip"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

      - name: Checksum
        id: zip
        run: |
          cd build
          ZIP="${{ matrix.app_name }}-${{ steps.ver.outputs.tag }}.zip"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo -n "$SHA" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "## SHA256 (${{ matrix.app_name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # Matrix jobs can't reliably fan their step outputs in to a single
      # downstream job, so the zip + its checksum travel as an artifact
      # instead - the release job below downloads both legs' artifacts.
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.app_name }}
          path: |
            build/${{ steps.zip.outputs.zip }}
            build/${{ steps.zip.outputs.zip }}.sha256
          if-no-files-found: error

  # One tag, one GitHub release carrying both apps' zips, and one Homebrew
  # tap commit carrying both casks - deliberately serialized here, and only
  # here. Notarization (the slow part, in `build` above) still runs as two
  # parallel matrix legs; only the parts that touch a single shared resource
  # (the release, the tap repo's git history) are sequenced.
  release:
    needs: build
    runs-on: macos-14
    env:
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' && 'true' || 'false' }}
      HAS_DEV_ID: ${{ secrets.DEV_ID_CERT_P12 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download KubeView artifact
        uses: actions/download-artifact@v4
        with:
          name: release-KubeView
          path: artifacts/KubeView

      - name: Download LgtmView artifact
        uses: actions/download-artifact@v4
        with:
          name: release-LgtmView
          path: artifacts/LgtmView

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          KUBEVIEW_ZIP="artifacts/KubeView/KubeView-${TAG}.zip"
          LGTMVIEW_ZIP="artifacts/LgtmView/LgtmView-${TAG}.zip"
          KUBEVIEW_SHA=$(cat "${KUBEVIEW_ZIP}.sha256")
          LGTMVIEW_SHA=$(cat "${LGTMVIEW_ZIP}.sha256")

          if [ "$HAS_DEV_ID" = "true" ]; then
            INSTALL_KUBEVIEW="brew install --cask kubeview"
            INSTALL_LGTMVIEW="brew install --cask lgtm-view"
            NOTE="Signed with a Developer ID certificate and notarized by Apple."
          else
            INSTALL_KUBEVIEW="brew install --cask kubeview --no-quarantine"
            INSTALL_LGTMVIEW="brew install --cask lgtm-view --no-quarantine"
            NOTE="Ad-hoc signed, not notarized — \`--no-quarantine\` is required."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## KubeView
          SHA256: \`$KUBEVIEW_SHA\`

          \`\`\`
          brew tap omaksi/tap
          $INSTALL_KUBEVIEW
          \`\`\`

          ## LgtmView
          SHA256: \`$LGTMVIEW_SHA\`

          \`\`\`
          brew tap omaksi/tap
          $INSTALL_LGTMVIEW
          \`\`\`

          $NOTE
          NOTES
          gh release create "$TAG" \
            "$KUBEVIEW_ZIP" \
            "$LGTMVIEW_ZIP" \
            --title "KubeView & LgtmView ${TAG}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          KUBEVIEW_SHA=$(cat "artifacts/KubeView/KubeView-${TAG}.zip.sha256")
          LGTMVIEW_SHA=$(cat "artifacts/LgtmView/LgtmView-${TAG}.zip.sha256")

          git clone "https://x-access-token:${GH_TOKEN}@github.com/omaksi/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks

          cat > Casks/kubeview.rb <<RUBY
          cask "kubeview" do
            version "${VERSION}"
            sha256 "${KUBEVIEW_SHA}"

            url "https://github.com/omaksi/kubeview/releases/download/${TAG}/KubeView-${TAG}.zip"
            name "KubeView"
            desc "Native macOS desktop app for viewing Kubernetes clusters"
            homepage "https://github.com/omaksi/kubeview"

            depends_on formula: "kubernetes-cli"
            depends_on macos: :sonoma

            app "KubeView.app"

            zap trash: [
              "~/Library/Preferences/com.omaksi.kubeview.plist",
            ]
          end
          RUBY

          cat > Casks/lgtm-view.rb <<RUBY
          cask "lgtm-view" do
            version "${VERSION}"
            sha256 "${LGTMVIEW_SHA}"

            url "https://github.com/omaksi/kubeview/releases/download/${TAG}/LgtmView-${TAG}.zip"
            name "LgtmView"
            desc "Native macOS LGTM stack inspector for Kubernetes clusters"
            homepage "https://github.com/omaksi/kubeview"

            depends_on formula: "kubernetes-cli"
            depends_on formula: "omaksi/tap/kubectl-lgtm"
            depends_on macos: :sonoma

            app "LgtmView.app"

            zap trash: [
              "~/Library/Preferences/com.omaksi.lgtmview.plist",
            ]
          end
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kubeview.rb Casks/lgtm-view.rb
          git commit -m "kubeview ${VERSION}, lgtm-view ${VERSION}"
          git push

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' && 'true' || 'false' }}
      HAS_DEV_ID: ${{ secrets.DEV_ID_CERT_P12 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          mkdir -p build
          lipo -create -output build/KubeView \
            .build/arm64-apple-macosx/release/KubeView \
            .build/x86_64-apple-macosx/release/KubeView
          lipo -info build/KubeView

      - name: Generate app icon
        run: |
          mkdir -p Resources
          ./scripts/make_icon.swift

      - name: Bundle .app
        run: |
          ./scripts/bundle.sh \
            --bin build/KubeView \
            --app-name KubeView \
            --bundle-id com.omaksi.kubeview \
            --product KubeView \
            --out build \
            --version "${{ steps.ver.outputs.version }}"

      # Imports into a throwaway keychain rather than login.keychain — the
      # runner is ephemeral, but a temp keychain keeps the private key out of
      # any step that doesn't need it and dies with the job.
      - name: Import Developer ID certificate
        if: env.HAS_DEV_ID == 'true'
        env:
          DEV_ID_CERT_P12: ${{ secrets.DEV_ID_CERT_P12 }}
          DEV_ID_CERT_PASSWORD: ${{ secrets.DEV_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$DEV_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$DEV_ID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          # Read the identity back rather than hardcoding the name — it embeds
          # the team ID and has to match the cert byte for byte.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported .p12"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Hardened runtime (--options runtime) and a secure timestamp are both
      # mandatory for notarization; a signature missing either is rejected.
      - name: Sign
        run: |
          if [ "$HAS_DEV_ID" = "true" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" build/KubeView.app
          else
            echo "::warning::No Developer ID secrets — falling back to ad-hoc signing (not notarized)"
            codesign --force --deep --sign - build/KubeView.app
          fi
          codesign --verify --strict --verbose=2 build/KubeView.app

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent KubeView.app \
            "KubeView-${{ steps.ver.outputs.tag }}.zip"

      # Staples the ticket onto the .app, so the zip has to be rebuilt
      # afterwards — and the checksum taken after that, not before.
      - name: Notarize and staple
        if: env.HAS_DEV_ID == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          cd build
          ZIP="KubeView-${{ steps.ver.outputs.tag }}.zip"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple KubeView.app
          xcrun stapler validate KubeView.app
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent KubeView.app "$ZIP"

      - name: Checksum
        id: zip
        run: |
          cd build
          ZIP="KubeView-${{ steps.ver.outputs.tag }}.zip"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "## SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_DEV_ID" = "true" ]; then
            INSTALL="brew trust omaksi/tap
          brew install --cask kubeview"
            NOTE="Signed with a Developer ID certificate and notarized by Apple."
          else
            INSTALL="brew install --cask kubeview --no-quarantine"
            NOTE="Ad-hoc signed, not notarized — \`--no-quarantine\` is required."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          SHA256: \`${{ steps.zip.outputs.sha256 }}\`

          Install via tap:
          \`\`\`
          brew tap omaksi/tap
          $INSTALL
          \`\`\`

          $NOTE
          NOTES
          gh release create "${{ steps.ver.outputs.tag }}" \
            "build/${{ steps.zip.outputs.zip }}" \
            --title "KubeView ${{ steps.ver.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          SHA="${{ steps.zip.outputs.sha256 }}"
          URL="https://github.com/omaksi/kubeview/releases/download/${TAG}/${{ steps.zip.outputs.zip }}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/omaksi/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks
          cat > Casks/kubeview.rb <<RUBY
          cask "kubeview" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "${URL}"
            name "KubeView"
            desc "Native macOS desktop app for viewing Kubernetes clusters"
            homepage "https://github.com/omaksi/kubeview"

            depends_on formula: "kubernetes-cli"
            depends_on macos: :sonoma

            app "KubeView.app"

            zap trash: [
              "~/Library/Preferences/com.omaksi.kubeview.plist",
            ]
          end
          RUBY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kubeview.rb
          git commit -m "kubeview ${VERSION}"
          git push

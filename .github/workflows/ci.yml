name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check for orphaned source files
        run: ./scripts/check-sources.sh

  go:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Tools/kubectl-lgtm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/kubectl-lgtm/go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

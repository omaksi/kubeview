name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check for orphaned source files
        run: ./scripts/check-sources.sh

      # swift test lands in the same change that adds test targets - none
      # exist yet, and `swift test` fails outright with no targets to run.

  go:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Tools/kubectl-lgtm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/kubectl-lgtm/go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
